# NGINX Deployment. Image must be fully qualified for OKE CRI-O.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: w3-demo
  labels:
    app: nginx
    lab: week3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
        lab: week3
    spec:
      containers:
        - name: nginx
          # Fully qualified image is required on OKE CRI-O (short names / empty image fail).
          image: docker.io/library/nginx:alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nginx-data
